name: Build APK
# MANUAL ONLY. Nothing runs on push. Start it from: Actions > Build APK > Run workflow.
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes. Separate points with | (pipe). Empty = use release-notes/vX.Y.Z.md, else auto-generate'
        required: false
        type: string
        default: ''
      publish_release:
        description: 'Publish a GitHub Release (untick to only build the APK artifact)'
        required: false
        type: boolean
        default: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the GitHub Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      # The build STOPS here if the permanent key is missing. It never falls back to a random key,
      # because an APK signed with a random key can never update the installed app.
      - name: Restore permanent signing key
        env:
          PASS: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$PASS" ]; then
            echo "::error::Secret KEYSTORE_PASSPHRASE is missing. Settings > Secrets and variables > Actions."; exit 1
          fi
          if [ ! -f signing/debug.keystore.gpg ]; then
            echo "::error::signing/debug.keystore.gpg is missing. Run the 'Create signing key (run once)' workflow."; exit 1
          fi
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" \
              -o "$RUNNER_TEMP/cem.keystore" -d signing/debug.keystore.gpg
          keytool -list -keystore "$RUNNER_TEMP/cem.keystore" -storepass android -alias androiddebugkey > "$RUNNER_TEMP/keytool.txt"
          cat "$RUNNER_TEMP/keytool.txt"
          echo "CEM_KEYSTORE=$RUNNER_TEMP/cem.keystore" >> "$GITHUB_ENV"
          KEY_SHA=$(grep -oiE '([0-9A-F]{2}:){31}[0-9A-F]{2}' "$RUNNER_TEMP/keytool.txt" | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          [ -n "$KEY_SHA" ] || { echo "::error::Could not read the key fingerprint"; exit 1; }
          echo "KEY_SHA=$KEY_SHA" >> "$GITHUB_ENV"

      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android

      # v3.3.0: Google sign-in inside the APK. Needs the GOOGLE_SERVICES_JSON secret (SETUP.md > Upgrade to 3.3.0).
      - name: Add Google sign-in (Android)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash scripts/patch-google-signin.sh

      # v3.5.0: ticket scanning inside the APK (free ML Kit plugin). Adds the camera permission and scanner meta-data to the manifest.
      - name: Add ticket scanner (Android)
        run: bash scripts/patch-scanner.sh

      - name: Set version and signing in build.gradle
        run: bash scripts/patch-android.sh

      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Verify the APK is signed with the permanent key
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/apk-certs.txt"
          APK_SHA=$(grep -i 'certificate SHA-256 digest' "$RUNNER_TEMP/apk-certs.txt" | grep -oiE '[0-9A-F]{64}' | head -1 | tr 'A-F' 'a-f')
          if [ "$APK_SHA" != "$KEY_SHA" ]; then
            echo "::error::APK is NOT signed with the permanent key ($APK_SHA vs $KEY_SHA)"; exit 1
          fi
          VC=$(grep -oP 'versionCode \K[0-9]+' android/app/build.gradle | head -1)
          VN=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle | head -1)
          cp "$APK" "android/app/build/outputs/apk/debug/campus-events-v$VN.apk"
          {
            echo "### APK signing check passed"
            echo "- version name: **$VN**, version code: **$VC** (must be higher than the installed app's)"
            echo "- signing certificate SHA-256: \`$APK_SHA\` (identical on every build; if it ever changes, updates will fail)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: campus-events-apk
          path: android/app/build/outputs/apk/debug/campus-events-v*.apk
          if-no-files-found: error

      # Publishes the APK as a GitHub Release, so the download website shows it by itself.
      # Release notes, in order of priority:
      #   1) the text typed in "release_notes" when you pressed Run workflow (points separated by |)
      #   2) release-notes/vX.Y.Z.md, if that file exists in the repo
      #   3) notes GitHub writes from the commits
      # - Release for this version does not exist yet: it is created with the APK attached.
      # - Release exists (same version): the APK on it is OVERWRITTEN with the new build
      #   (same file name is replaced in place; any other old .apk on that release is removed).
      # - Release exists and you typed notes: the notes are replaced with what you typed.
      #   (Notes written elsewhere are only overwritten when you type new ones here.)
      - name: Publish GitHub Release
        if: github.ref_name == 'main' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Passed through env (never pasted into the script) so quotes or $() in the notes cannot run as code.
          TYPED_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          VN=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle | head -1)
          TAG="v$VN"
          APK="android/app/build/outputs/apk/debug/campus-events-v$VN.apk"

          # Turn "Fix login | Faster load | New icon" into a bullet list.
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          TYPED=0
          if [ -n "${TYPED_NOTES//[[:space:]]/}" ]; then
            : > "$NOTES_FILE"
            IFS='|' read -ra PARTS <<< "$TYPED_NOTES"
            for P in "${PARTS[@]}"; do
              P="$(printf '%s' "$P" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              [ -n "$P" ] && printf -- '- %s\n' "$P" >> "$NOTES_FILE"
            done
            TYPED=1
          elif [ -f "release-notes/$TAG.md" ]; then
            cp "release-notes/$TAG.md" "$NOTES_FILE"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            APK_NAME="$(basename "$APK")"
            EXISTING_APKS="$(gh release view "$TAG" --json assets --jq '.assets[].name' | grep -i '\.apk$' || true)"
            HAD_APK=0
            [ -n "$EXISTING_APKS" ] && HAD_APK=1

            # --clobber replaces the asset with the same name in place, so the release never
            # sits without an APK (upload first, delete leftovers after).
            gh release upload "$TAG" "$APK" --clobber

            # Remove any OTHER .apk on this release (e.g. one uploaded under a different name),
            # so the release always carries exactly one APK: the newest build.
            while IFS= read -r OLD; do
              [ -n "$OLD" ] && [ "$OLD" != "$APK_NAME" ] || continue
              gh release delete-asset "$TAG" "$OLD" --yes
            done <<< "$EXISTING_APKS"

            if [ "$HAD_APK" = 1 ]; then
              echo "- Release **$TAG** already existed: its APK was **overwritten** with the new build." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- APK added to the existing release **$TAG**." >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "$TYPED" = 1 ]; then
              gh release edit "$TAG" --notes-file "$NOTES_FILE"
              echo "- Release notes of **$TAG** updated with the text you typed." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          if [ -s "$NOTES_FILE" ]; then
            NOTES=(--notes-file "$NOTES_FILE")
          else
            NOTES=(--generate-notes)
          fi
          gh release create "$TAG" "$APK" --title "$TAG" --target "$GITHUB_SHA" --latest "${NOTES[@]}"
          echo "- Published release **$TAG** with the APK attached." >> "$GITHUB_STEP_SUMMARY"
