const ME='Riya Sen',PPL=[ME,'Arjun Rao','Meera Iyer'],CATS=['No category','Decor','Sound and AV','Food'];
const BRIEF='Call Sharma Sound. Ask for 2 mics and a mixer.';
let TAB,GR,GF,TF,IF,BX,FIL,XW,DD,TK,IT;

const inp=(k,ph,c='',st='')=>`<div class="in ${c}" id="${k}" style="${st}"><span class="v" data-ph="${ph}">${esc(F[k])}</span><i class="ca"></i></div>`;

const irow=(i,n)=>`<div class="tkr"><div class="t1"><input type="checkbox" id="ib${n}" ${i.b?'checked':''}><span class="tt ${i.b?'dn':''}">${esc(i.t)}${i.q>1?' ×'+i.q:''}</span><span class="amt">${i.b?R(i.ac):'est. '+R(i.p)}</span></div><div class="t2"><span>${i.w}</span>${i.c!==CATS[0]?`<span class="pill">${i.c}</span>`:''}${i.b?'<span class="pill ok">Bought</span>':''}<span class="ta"><span class="btn ghost sm del">Delete</span></span></div>${BX===n&&!i.b?`<div class="fp row">${inp('ac','What did it cost? ₹','','width:170px')}<span class="btn sm" id="cb">Confirm bought</span></div>`:''}</div>`;
function drawT(){
 const bn=IT.filter(i=>i.b).length,done=TK.filter(k=>k.done).length+bn,tot=TK.length+IT.length,p=tot?Math.round(done/tot*100):0;

 const gform=GF?`<div class="fp row" style="margin-top:12px">${inp('g','Group name, e.g. Logistics','','flex:1')}<span class="btn sm" id="ga">Add group</span></div>`:'';
 const tform=`<div class="fp"><label class="first">Task *</label>${inp('t','What needs to be done?')}<label>Assign to</label>${sel('w',PPL)}<label>Due date</label>${inp('d','dd/mm/yyyy')}<label>Brief (optional)</label>${inp('x','Steps, links, deadlines...','ta2')}<div class="acts"><span class="btn" id="mk">Add task</span><span class="btn ghost">Cancel</span></div></div>`;
 const iform=`<div class="fp"><label class="first">Item *</label>${inp('it','Banner, 3 x 6 ft')}<label>Quantity</label>${inp('q','')}<label>Estimated cost in ₹ (whole line)</label>${inp('p','')}<label>Allocate to</label>${sel('iw',['Unassigned',...PPL])}<label>Budget category</label>${sel('ic',CATS)}<div class="acts"><span class="btn" id="mi">Add item</span><span class="btn ghost">Close</span></div></div>`;
 const by={};IT.forEach(i=>(by[i.w]=by[i.w]||[]).push(i));
 const who=Object.keys(by).map(k=>{const l=by[k],b=l.filter(i=>i.b);return `<div class="li"><div class="main"><div class="ttl">${k}</div><div class="sub">${l.length} item${l.length>1?'s':''}, ${b.length} bought</div></div><span class="sub">To buy ${R(sum(l.filter(i=>!i.b),'p'))}, spent ${R(sum(b,'ac'))}</span></div>`}).join('');
 E.tk.innerHTML=`<div class="card" id="sum"><div class="sh"><h3>Tasks and items to buy</h3><span class="meta">${done} of ${tot} done</span></div><div class="bar"><i style="width:${p}%"></i></div>
 <div class="chips">${[['all','All'],['mine','Mine and my team'],['open','To do'],['done','Done']].map(c=>`<span class="chip${FIL===c[0]?' on':''}" id="f_${c[0]}">${c[1]}</span>`).join('')}</div>
 ${GR?`<div class="row" style="margin-top:12px"><span class="btn ghost sm" id="ng">${GF?'Close':'+ New group'}</span><span class="btn ghost sm">Add standard groups</span></div>`:''}${gform}</div>
 ${GR?`<div class="card"><div class="sh"><h3>${GR}</h3><div class="row"><span class="meta">${TK.filter(k=>k.done).length} of ${TK.length} done</span><span class="btn ghost sm del">Delete group</span></div></div>${vt||'<p class="meta" style="margin:0">No tasks here yet.</p>'}${TF?tform:'<div style="margin-top:8px"><span class="btn ghost sm" id="at">+ Add task</span></div>'}</div>`
 :`<div class="empty" id="emp" style="margin:14px 20px 0"><p style="margin:0 0 10px">No task groups yet.</p><div class="row" style="justify-content:center"><span class="btn">Add standard groups</span><span class="btn ghost" id="ng2">New group</span></div></div>`}
 <div class="card" id="icard"><div class="sh"><h3>Items to buy</h3><div class="row"><span class="meta">${bn} of ${IT.length} bought</span><span class="btn ghost sm" id="ai">${IF?'Close form':'+ Add item'}</span></div></div>${IF?iform:''}${vi||`<p class="meta" style="margin:8px 0 0">${IT.length?'Nothing in this filter.':'No items yet.'}</p>`}
 ${IT.length?`<p class="meta" id="est" style="margin:10px 0 0">Still to buy (estimate): <b>${R(sum(IT.filter(i=>!i.b),'p'))}</b>. Spent on bought items: <b>${R(sum(IT.filter(i=>i.b),'ac'))}</b>.</p><div style="margin-top:6px"><span class="lk" id="xw">${XW?'Hide':'Show'} who is buying what</span></div>${XW?`<div id="xwl">${who}</div>`:''}`:''}</div>`;
 const n=TK.filter(k=>!k.done).length+IT.filter(i=>!i.b).length;E.t_tk.innerHTML='Tasks'+(n?`<em>${n}</em>`:'')}
function tabs(){E.det.classList.toggle('hide',TAB!=='det');E.tk.classList.toggle('hide',TAB!=='tk');E.t_det.className=TAB==='det'?'on':'';E.t_tk.className=TAB==='tk'?'on':'';E.body.scrollTop=0}

function keys(m){E.kb.innerHTML='<div class="tb"><span id="kbh"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M5 9l7 7 7-7" fill="none" stroke="#5b6380" stroke-width="2.4" stroke-linecap="round"/></svg></span></div>'+(m==='num'?'<div class="np">'+'123456789'.split('').map(k=>`<b data-k="${k}">${k}</b>`).join('')+'<b></b><b data-k="0">0</b><b>&#9003;</b></div>':['1234567890','qwertyuiop','asdfghjkl','zxcvbnm'].map((r,i)=>`<div class="kr" style="padding:0 ${[0,0,16,36][i]}px">`+[...r].map(k=>`<b data-k="${k}">${k}</b>`).join('')+'</div>').join('')+'<div class="kr"><b style="flex:1.5">?123</b><b data-k=",">,</b><b data-k=" " style="flex:5"></b><b data-k=".">.</b><b class="ok" style="flex:1.5">&#10003;</b></div>')}
async function kbo(m){if(E.kb.classList.contains('up')){if(E.kb.dataset.m!==m){keys(m);E.kb.dataset.m=m}return}keys(m);E.kb.dataset.m=m;void E.kb.offsetWidth;E.kb.classList.add('up');E.scr.style.setProperty('--kb','270px');await W(380)}
const unpop=()=>E.pop.classList.remove('on');
function popAt(t,x,px,py){if(fast)return;const w=216,p=E.pop;p.innerHTML='<b>'+t+'</b>'+x;p.className='';const l=Math.max(24,Math.min(404-24-w,px-w/2));p.style.left=l+'px';p.style.setProperty('--ax',Math.max(14,Math.min(w-24,px-l-5))+'px');const h=p.offsetHeight,up=py>430;p.style.top=Math.max(44,Math.min(770-h,up?py-h-16:py+28))+'px';void p.offsetWidth;p.className='on '+(up?'dn2':'up')}

const hideKb=async()=>{if(!E.kb.classList.contains('up'))return;await tp($('#kbh'));await kbc();foc(null)};
const tst=async(t,ms=1500)=>{E.toast.textContent=t;E.toast.classList.add('on');snd('ok');await W(ms);E.toast.classList.remove('on')};
async function see(el){const b=E.body,r=el.getBoundingClientRect(),c=b.getBoundingClientRect(),s=S(),bi=E.kb.classList.contains('up')?20:92;let d=0;if(r.bottom>c.bottom-bi*s)d=r.bottom-c.bottom+(bi+8)*s;else if(r.top<c.top+44*s)d=r.top-c.top-52*s;if(d<0&&b.scrollTop===0)d=0;if(d){b.scrollTo({top:b.scrollTop+d/s,behavior:fast?'auto':'smooth'});await W(fast?0:550)}}

 const m=T.m;

{t:'Tap “+ Add task”',d:'Inside the Logistics group, tap + Add task. A short form opens.',tip:'Members without Manage tasks can still add tasks for themselves and for people who report to them.',run:async()=>{await tp($('#at'),'+ Add task','Opens the form inside this group.');TF=true;drawT();await W(500)}},
{t:'Write the task',d:'Type what needs to be done. Keep it short and start with a verb.',tip:'The title can have up to 120 characters. Nothing is saved until you tap Add task.',run:async()=>{await fill('t','Book the sound system','Task','What needs doing, in a few words.');await hideKb()}},
{t:'Choose who does it, and when',d:'Open Assign to and pick a teammate. Then enter a due date.',tip:'The list also has people without the app (People tab, + Add person), so volunteers can get tasks too. On a phone the date field opens a date picker. A due date is optional.',run:async()=>{await pick('w',1,'Assign to','Everyone in the event, plus volunteers you added by hand.');await fill('d','05/11/2026','Due date','Optional. Late tasks later show a red label.','num');await hideKb()}},
{t:'Add a brief (optional)',d:'Use the Brief box for steps, links or deadlines, so the person knows exactly what to do.',tip:'A brief can hold up to 600 characters. Add or change it later with + Brief on the task.',run:async()=>{await fill('x',BRIEF,'Brief','Anything the assignee should know.');await hideKb()}},
{t:'Tap “Add task”',d:'Tap Add task. The task appears in the group with the person’s name and the due date.',tip:'The person is alerted and finds the task under My tasks in the top menu, across all their events.',run:async()=>{await tp($('#mk'),'Add task','Saves the task and gives it to Arjun.');TK.push({...T1,w:F.w});TF=false;drawT();await tst('Task added',1300);await sp($('.tkr'),'Arjun is alerted','He gets a notification and sees it in My tasks.',.5,.4,3000);nxt()}}]};

{t:'Tap “+ Add item”',d:'Tap + Add item. The form opens inside the card.',tip:'Tap Close form to hide it again.',run:async()=>{await tp($('#ai'),'+ Add item','Opens the item form.');IF=true;drawT();await W(500)}},
{t:'Describe the item',d:'Type the item with its size or colour, then the quantity and the estimated cost.',tip:'The estimate is for the whole line: 2 banners at ₹600 each is ₹1,200.',run:async()=>{await fill('it','Banner, 3 x 6 ft','Item','Add the size or colour here.');F.q='';draw('q');await fill('q','2','Quantity','How many to buy.','num');await fill('p','1200','Estimated cost','Price of the whole line, not each piece.','num');await hideKb()}},
{t:'Give it to someone',d:'Open Allocate to and pick who will buy it. Choose a budget category if you use one.',tip:'The person is alerted and also sees the item in My tasks. Budget category shows once you have added budget lines in Expenses.',run:async()=>{await pick('iw',3,'Allocate to','The buyer. Leave Unassigned if you have not decided.');await pick('ic',1,'Budget category','Links the cost to a budget line in Expenses.')}},
{t:'Tap “Add item”',d:'Tap Add item. The item appears with the quantity, the estimate, the buyer and the category.',tip:'Items not yet bought count in your budget as money still to pay, at their estimate.',run:async()=>{await tp($('#mi'),'Add item','Adds the item to the list.');IT.push({t:F.it,q:+F.q,p:+F.p,w:F.iw,c:F.ic});IF=false;drawT();await tst('Item added',1300);await sp($('#est'),'Still to buy','The total estimate of everything not bought yet.',.5,.5,2800);nxt()}}]};
/* ================= Part 3: keep track ================= */
const TC={m:'C',h:'Keep track of everything',st:[
{t:'Read the progress bar',d:'The card at the top shows how many tasks and items are done. The bar fills as you tick things off.',tip:'Tasks and items to buy are counted together. All, Mine and my team, To do and Done filter both lists.',run:async()=>{await W(800);await sp($('#sum'),'0 of 5 done','3 tasks and 2 items, none finished yet.',.5,.3,3000)}},
{t:'Open a task’s Brief',d:'Tap Brief on a task to read the steps. Tap it again to close it.',tip:'Anyone who can edit the task sees Edit brief inside it.',run:async()=>{await tp($('#bf0'),'Brief','Shows the steps, links and deadlines.');TK[0].o=1;drawT();await W(500);await sp($('#bd0'),'Arjun’s instructions','Everything he needs is here.',.5,.5,2400)}},
{t:'Tick a task when it is done',d:'Tick the box. The title is crossed out and the progress bar moves.',tip:'You can tick your own tasks and those of people who report to you. Roles with Manage tasks can tick any task.',run:async()=>{await tp($('#ck0'),'Done','Tick it once the work is finished.');TK[0].done=1;drawT();snd('ok');await W(500);await sp($('#sum'),'1 of 5 done','The bar and the count update at once.',.5,.3,2600)}},

{t:'See who is buying what',d:'Under the items, tap Show who is buying what. Each person gets a line with items, bought count and money.',tip:'Everyone sees their own items under My tasks in the top menu.',run:async()=>{await tp($('#xw'),'Show who is buying what','A summary per person.');XW=true;drawT();await W(500);await sp($('#xwl'),'Per person','What each one still has to buy and has already spent.',.5,.3,3200)}}]};
const PARTS={A:TA,B:TB,C:TC};
function mount(n){T=PARTS[n];['A','B','C'].forEach(k=>E['t'+k].className=k===n?'on':'');E.h.textContent=T.h;E.steps.innerHTML=T.st.map((s,k)=>`<li data-n="${k+1}"><b>${s.t}</b><p>${s.d}</p></li>`).join('');E.prog.innerHTML=T.st.map(()=>'<i></i>').join('')}
E.tC.onclick=()=>{mount('C');play(0)};E.bC.onclick=()=>{mount(T===TA?'B':'C');play(0)};
addEventListener('resize',fit);fit();mount('A');play(0);
</script></body></html>
