<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="splash.css">
<title>Your ticket</title>
<style>
:root{box-sizing:border-box;--ink:#14213d;--mute:#5b6678;--line:#d9e0ea;--acc:#4f6bff}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;min-height:100vh;font:15px/1.5 'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#fff;padding:max(16px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom));
background:radial-gradient(800px 480px at 8% 0%,rgba(123,147,255,.45),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(255,122,184,.35),transparent 60%),linear-gradient(135deg,#0a0f2e,#16205c 60%,#2a1f6e)}
main{max-width:440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;margin:6px 0 16px}
.card{background:#fff;color:var(--ink);border-radius:18px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.4);margin-bottom:14px}
h1{font-size:22px;margin:0 0 4px}.meta{color:var(--mute);font-size:13px;margin:0}
.step{display:flex;gap:10px;align-items:center;font-weight:700;margin:0 0 10px}.step i{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;font-style:normal;font-size:13px}
.qr{text-align:center;margin:12px 0}.qr svg{max-width:300px;width:100%;height:auto;border:1px solid var(--line);border-radius:12px;padding:6px;background:#fff}
.amt{font-size:30px;font-weight:800;text-align:center}
.det{background:#f2f5fa;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}.det b{word-break:break-all}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
input{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;color:var(--ink);background:#fff}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 14px;cursor:pointer}
.go{width:100%;margin-top:16px;background:linear-gradient(135deg,#4f6bff,#9b5cff);color:#fff}.go:disabled{opacity:.6}
.alt{background:#eef1fb;color:var(--ink);padding:8px 12px;font-size:13px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.err{color:#c2331f;min-height:18px;font-size:13px;margin:8px 0 0}
.ok{text-align:center}.ok b{font-size:44px;display:block;color:#12805c}
</style><style>*{-webkit-tap-highlight-color:transparent}button,a.btn,summary,label{-webkit-user-select:none;user-select:none}input,textarea,select{-webkit-user-select:text;user-select:text}</style></head><body>
<div id="splash" role="status" aria-label="Loading Campus Events"><div class="sp-logo"><i class="sp-ring"></i><div class="sp-mark"><svg viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="lgs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7b93ff"/><stop offset="1" stop-color="#ff7ab8"/></linearGradient></defs><rect width="40" height="40" fill="url(#lgs)"/><path d="M11 15h18v4a2 2 0 0 0 0 4v4H11v-4a2 2 0 0 0 0-4z" fill="#fff"/></svg></div></div><div class="sp-name">Campus Events</div><div class="sp-sub">Getting your events ready</div><div class="sp-bar"><i></i></div></div>
<main>
<div class="brand"><svg width="30" height="30" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7b93ff"/><stop offset="1" stop-color="#ff7ab8"/></linearGradient></defs><rect width="40" height="40" rx="11" fill="url(#g)"/><path d="M11 15h18v4a2 2 0 0 0 0 4v4H11v-4a2 2 0 0 0 0-4z" fill="#fff"/></svg>Campus Events</div>
<div id="root"><div class="card"><p class="meta">Loading your ticket...</p></div></div>
</main>
<script>window.SPLASH_HOLD=1</script>
<script src="splash.js"></script>
<script src="qrcode.js"></script>
<script>
/* CEM 3.5.0: a person's QR ticket. Opened from a link the organizers send: ticket.html#e=CODE&r=TICKETID&n=NAME&t=EVENT&d=DATE&v=VENUE
   Everything is in the link, so this page needs no sign-in and no database. The QR holds only the event code and the ticket id;
   the scanner at the gate looks the ticket up in the event's attendee list. Keep the link private: whoever holds it holds the ticket. */
const $=id=>document.getElementById(id),root=$('root');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p=new URLSearchParams(location.hash.replace(/^#/,'')),e=(p.get('e')||'').toUpperCase(),r=p.get('r')||'';
if(!/^[A-Z]{6}$/.test(e)||!/^[A-Za-z0-9_-]{4,40}$/.test(r)){root.innerHTML='<div class="card"><h1>Ticket unavailable</h1><p class="meta">This ticket link is incomplete. Ask the organizers to send it again.</p></div>'}
else{
 const payload='CEM1:'+e+':'+r;let svg='';
 try{const q=qrcode(0,'M');q.addData(payload);q.make();svg=q.createSvgTag(10,4)}catch(x){}
 const d=p.get('d')||'',when=new Date(d+'T00:00:00'),dt=isNaN(when)?esc(d):when.toLocaleDateString([],{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 document.title='Ticket: '+(p.get('t')||'');
 root.innerHTML=`<div class="card" style="text-align:center"><p class="meta">${esc(p.get('t')||'Event ticket')}</p><h1>${esc(p.get('n')||'')}</h1>
  <p class="meta">${dt}${p.get('v')?'<br>'+esc(p.get('v')):''}</p>
  <div class="qr" id="qr">${svg||'<p class="meta">The QR code could not be drawn. Show this code at the gate: '+esc(payload)+'</p>'}</div>
  <p class="meta">Show this QR code at the entrance. Brightness up helps the scanner.</p>
  <div class="row"><button class="alt" id="dl">Save image</button></div>
  <p class="meta" style="margin-top:10px">Ticket ${esc(r)}</p></div>`;
 setTimeout(()=>window.splashDone&&splashDone(),0);
 $('dl').onclick=()=>{const el=document.querySelector('#qr svg');if(!el)return;
  const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=720;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,720,720);x.drawImage(img,0,0,720,720);
   const a=document.createElement('a');a.download='ticket.png';a.href=c.toDataURL('image/png');document.body.append(a);a.click();a.remove()};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(el))};
}
</script></body></html>
