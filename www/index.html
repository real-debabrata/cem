<title>Campus Events</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7fb;--card:#fff;--ink:#10172b;--mute:#5b6380;--line:#e1e4ef;--acc:#5948f5;--accink:#fff;--ok:#087a62;--okf:#35c9a5;--bad:#c2331f}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10172b;--card:#1a2240;--ink:#f6f7fb;--mute:#a5abc4;--line:#2b3558;--acc:#8f84ff;--accink:#10172b;--ok:#35c9a5;--okf:#35c9a5;--bad:#ff8a78;--tm:40%}}
:root[data-theme="dark"]{--bg:#10172b;--card:#1a2240;--ink:#f6f7fb;--mute:#a5abc4;--line:#2b3558;--acc:#8f84ff;--accink:#10172b;--ok:#35c9a5;--okf:#35c9a5;--bad:#ff8a78;--tm:40%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
h1,h2,h3{font-family:'Poppins',system-ui,sans-serif;margin:0;line-height:1.15}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{font-size:20px;margin-right:auto}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--mute);font:inherit;font-weight:500;padding:8px 12px;border-radius:8px;cursor:pointer}
nav button.on{background:var(--acc);color:var(--accink)}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.btn{background:var(--acc);color:var(--accink);border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:13px}.btn.del{color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat b{font:800 28px 'Poppins',sans-serif;display:block}.stat span{color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.ev{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--tc);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.ev h3{font-size:18px}.tag{font-size:12px;font-weight:700;color:color-mix(in srgb,var(--tc),var(--ink) var(--tm,0%))}
.meta{color:var(--mute);font-size:13px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--tc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
label{display:block;font-weight:500;font-size:13px;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input[type=checkbox]{width:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.fld{display:grid;grid-template-columns:2fr 1fr auto auto;gap:6px;align-items:center;margin-bottom:6px}
.fld input,.fld select{padding:6px 8px}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}
.in{color:var(--ok);font-weight:700}
.empty{text-align:center;color:var(--mute);padding:30px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:9}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}.chip.on{background:var(--ink);color:var(--bg)}
.qr{background:#fff;padding:8px;display:inline-block;border-radius:8px}.qr svg{display:block;max-width:100%;height:auto}
</style><script src="qrcode.js"></script><style>.gate body{visibility:hidden}</style><script>document.documentElement.className="gate"</script></head><body>
<div id="splash" role="status" aria-label="Loading Campus Events"><div class="sp-logo"><i class="sp-ring"></i><div class="sp-mark"><svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="120" fill="#5948F5"/><path fill="#F6F7FB" transform="translate(136.4 105.2) scale(1.3)" d="M34 0 H160 A24 24 0 0 1 184 24 A24 24 0 0 1 160 48 H62 A14 14 0 0 0 48 62 V78 A14 14 0 0 0 62 92 H160 A24 24 0 0 1 184 116 A24 24 0 0 1 160 140 H62 A14 14 0 0 0 48 154 V170 A14 14 0 0 0 62 184 H160 A24 24 0 0 1 184 208 A24 24 0 0 1 160 232 H34 A34 34 0 0 1 0 198 V34 A34 34 0 0 1 34 0 Z"/></svg></div></div><div class="sp-name">Campus Events</div><div class="sp-sub">Getting your events ready</div><div class="sp-bar"><i></i></div></div>
<header><h1 style="display:flex;align-items:center;gap:8px"><svg width="26" height="26" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="120" fill="#5948F5"/><path fill="#F6F7FB" transform="translate(136.4 105.2) scale(1.3)" d="M34 0 H160 A24 24 0 0 1 184 24 A24 24 0 0 1 160 48 H62 A14 14 0 0 0 48 62 V78 A14 14 0 0 0 62 92 H160 A24 24 0 0 1 184 116 A24 24 0 0 1 160 140 H62 A14 14 0 0 0 48 154 V170 A14 14 0 0 0 62 184 H160 A24 24 0 0 1 184 208 A24 24 0 0 1 160 232 H34 A34 34 0 0 1 0 198 V34 A34 34 0 0 1 34 0 Z"/></svg>Campus Events</h1><nav id="nav"></nav></header>
<main id="app"></main>
<script>
const TYPES={Fest:'#d9482b',Seminar:'#5948f5',Webinar:'#0e8a8a',Workshop:'#a2650a',Cultural:'#b02a82',Sports:'#2e8b3d'};
const PRESETS={
 Fest:[['Full name','text',1],['College ID','text',1],['Department','text',0],['Teams / events joining','text',0]],
 Seminar:[['Full name','text',1],['College ID','text',1],['Year of study','select',0,'1st,2nd,3rd,4th']],
 Webinar:[['Full name','text',1],['Email','text',1]],
 Workshop:[['Full name','text',1],['College ID','text',1],['Laptop available','checkbox',0],['Experience level','select',1,'Beginner,Intermediate,Advanced']],
 Cultural:[['Full name','text',1],['College ID','text',1],['Performing?','checkbox',0],['Act details','text',0]],
 Sports:[['Full name','text',1],['College ID','text',1],['Team name','text',0],['T-shirt size','select',1,'S,M,L,XL']]};
const uid=()=>Math.random().toString(36).slice(2,9);
// 3.5.0: attendee ids are the secret inside a QR ticket, so they come from the browser's secure random generator (12 characters).
const rid=()=>{try{const a=new Uint8Array(12);crypto.getRandomValues(a);return Array.from(a,x=>'abcdefghijkmnpqrstuvwxyz23456789'[x%32]).join('')}catch(e){return uid()+uid()}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mk=p=>PRESETS[p].map(f=>({id:uid(),label:f[0],type:f[1],req:!!f[2],opts:f[3]||''}));
const d=n=>{const x=new Date();x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
let S={events:[],regs:[]};
try{const r=localStorage.getItem('campus-events-v1');if(r)S=JSON.parse(r)}catch(e){}
const ensure=e=>{e.croles=e.croles||[];e.team=e.team||[];e.groups=e.groups||[];e.tasks=e.tasks||[];e.teams=e.teams||[];e.don=e.don||[];e.forms=e.forms||[];e.payments=e.payments||[];e.bud=e.bud||[];e.ven=e.ven||[];e.exp=e.exp||[];e.itm=e.itm||[];e.spn=e.spn||[];e.pay=e.pay||{upi:'',payee:'',fee:0};return e};
S.events.forEach(ensure);
let V={dt:'info',qr:0,tab:'dash',eid:null,filter:'All',es:'all',eo:'date',q:'',draft:null};   // 3.13.0: es = status filter, eo = sort order of the Events tab
const save=()=>{try{localStorage.setItem('campus-events-v1',JSON.stringify(S))}catch(e){}window.onSave&&window.onSave()};
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),1800)};
const ev=id=>S.events.find(e=>e.id===id);
const regsOf=id=>S.regs.filter(r=>r.eid===id);
const fmt=e=>new Date(e.date+'T'+(e.time||'00:00')).toLocaleString([], {weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const go=(t,eid=null)=>{V.tab=t;V.eid=eid;if(t==='new'&&!V.draft)V.draft=newDraft();render();scrollTo(0,0)};
function newDraft(){return{id:null,name:'',type:'Seminar',date:d(7),time:'10:00',venue:'',cap:100,desc:'',fields:mk('Seminar'),team:[],groups:[],tasks:[],teams:[],don:[],forms:[],payments:[],bud:[],ven:[],exp:[],itm:[],spn:[],croles:[],pay:{upi:'',payee:'',fee:0}}}

function render(){
 const nav=[['dash','Dashboard'],['events','Events'],['mine','My tasks'+(window.mineCount?mineCount():'')],['new','New event']];
 document.getElementById('nav').innerHTML=nav.map(n=>`<button class="${V.tab===n[0]||(V.tab==='detail'&&n[0]==='events')?'on':''}" data-go="${n[0]}">${n[1]}</button>`).join('');
 const a=document.getElementById('app');
 a.innerHTML=V.tab==='mine'?mine():V.tab==='dash'?dash():V.tab==='events'?list():V.tab==='detail'?detail():form();
}
function dash(){
 const tot=S.regs.length,ci=S.regs.filter(r=>r.in).length,cap=S.events.reduce((s,e)=>s+e.cap,0);
 const up=[...S.events].filter(e=>e.date>=d(0)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 return `<div class="stats">
 <div class="stat"><b>${S.events.length}</b><span>Events</span></div>
 <div class="stat"><b>${tot}</b><span>Registrations</span></div>
 <div class="stat"><b>${ci}</b><span>Checked in</span></div>
 <div class="stat"><b>${cap?Math.round(tot/cap*100):0}%</b><span>Seats filled</span></div></div>
 <h2 style="margin-bottom:12px">Coming up</h2>
 ${up.length?`<div class="grid">${up.map(card).join('')}</div>`:'<div class="empty">No upcoming events. Create one from New event.</div>'}`;
}
function card(e){
 const n=regsOf(e.id).length,p=Math.min(100,Math.round(n/e.cap*100));
 return `<div class="ev" style="--tc:${TYPES[e.type]}"><span class="tag">${e.type}</span><h3>${esc(e.name)}</h3>
 <div class="meta">${fmt(e)}<br>${esc(e.venue)}</div>
 <div class="bar"><i style="width:${p}%"></i></div><div class="meta">${n} of ${e.cap} registered</div>
 <div class="row"><button class="btn sm" data-open="${e.id}">Manage</button></div></div>`;
}
/* 3.13.0: Events tab. Search, dropdown filters (type, status), a sort menu and one grouped list with a row per event.
   Typing in the search box redraws only the results (evPaint), so the cursor and the phone keyboard stay where they are. */
const EI={
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 pin:'<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
 link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
 down:'<path d="m6 9 6 6 6-6"/>',
 right:'<path d="m9 6 6 6-6 6"/>',
 x:'<path d="M6 6l12 12M18 6 6 18"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'};
const ei=n=>`<svg class="ei" viewBox="0 0 24 24" aria-hidden="true">${EI[n]}</svg>`;
const EV_SORT=[['date','Upcoming first'],['new','Latest first'],['name','Name A\u2013Z'],['reg','Most registered']];
// whole days from today to the event date, in the device's own time zone (negative = already past)
const dayGap=e=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(e.date||'');if(!m)return 0;const t=new Date();return Math.round((new Date(+m[1],m[2]-1,+m[3])-new Date(t.getFullYear(),t.getMonth(),t.getDate()))/864e5)};
const evWhen=(e,g)=>{
 if(g<0)return 'Ended';
 const t=e.time?new Date(e.date+'T'+e.time).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'all day';
 const day=g===0?'Today':g===1?'Tomorrow':new Date(e.date+'T00:00').toLocaleDateString([],{weekday:'short'});
 return day+', '+t};
const evVenue=v=>{
 v=String(v||'').trim();if(!v)return '';
 if(/^https?:\/\//i.test(v)){try{return ei('link')+`<span class="evtx">${esc(new URL(v).hostname.replace(/^www\./,''))}</span>`}catch(x){}}
 return ei('pin')+`<span class="evtx">${esc(v)}</span>`};
const evActive=()=>V.filter!=='All'||V.es!=='all'||!!V.q.trim();
function evRow(x){
 const e=x.e,g=x.g,n=x.n,cap=+e.cap>0?+e.cap:0,full=!!cap&&n>=cap,p=cap?Math.min(100,Math.round(n/cap*100)):0;
 const dt=/^\d{4}-\d{2}-\d{2}$/.test(e.date||'')?new Date(e.date+'T00:00'):null;
 const yr=dt&&dt.getFullYear()!==new Date().getFullYear()?' \u2019'+String(dt.getFullYear()).slice(2):'';
 const v=evVenue(e.venue);
 return `<button type="button" class="evr${g<0?' past':g===0?' today':''}${full?' full':''}" data-open="${esc(e.id)}">
 <span class="evd"><small>${dt?dt.toLocaleDateString([],{month:'short'})+yr:''}</small><b>${dt?dt.getDate():'\u2013'}</b></span>
 <span class="evm"><span class="evt">${esc(e.name)}</span><span class="evi"><span class="evk"><i style="background:${TYPES[e.type]||'var(--acc)'}"></i>${esc(e.type)}</span><span class="evw">${ei('clock')}${evWhen(e,g)}</span>${v?`<span class="evv">${v}</span>`:''}</span></span>
 <span class="evrg"><span class="evn">${full?'Full ('+n+' of '+cap+')':cap?`<b>${n}</b> of ${cap} registered`:`<b>${n}</b> registered`}</span>${cap?`<span class="bar"><i style="width:${p}%"></i></span>`:''}</span>
 <span class="evch">${ei('right')}</span></button>`}
function evView(){
 const cnt={};S.regs.forEach(r=>{cnt[r.eid]=(cnt[r.eid]||0)+1});
 const q=V.q.trim().toLowerCase(),key=e=>(e.date||'')+' '+(e.time||'00:00');
 let items=S.events.map(e=>({e,g:dayGap(e),n:cnt[e.id]||0}));const total=items.length;
 items=items.filter(x=>(V.filter==='All'||x.e.type===V.filter)&&(V.es==='all'||(V.es==='up'?x.g>=0:x.g<0))&&(!q||[x.e.name,x.e.venue,x.e.type].some(s=>String(s||'').toLowerCase().includes(q))));
 const by={
  date:(a,b)=>((a.g<0)-(b.g<0))||(a.g<0?key(b.e).localeCompare(key(a.e)):key(a.e).localeCompare(key(b.e))),
  new:(a,b)=>key(b.e).localeCompare(key(a.e)),
  name:(a,b)=>String(a.e.name).localeCompare(String(b.e.name),undefined,{sensitivity:'base'}),
  reg:(a,b)=>(b.n-a.n)||key(a.e).localeCompare(key(b.e))};
 items.sort(by[V.eo]||by.date);
 const count=items.length===total?`${total} event${total===1?'':'s'}`:`${items.length} of ${total} events`;
 if(!items.length)return{count,html:`<div class="evempty"><h3>No matching events</h3><p>Try a different search, or clear the filters to see all your events.</p><button type="button" class="btn ghost" data-clr="all">Clear filters</button></div>`};
 const up=items.filter(x=>x.g>=0),past=items.filter(x=>x.g<0);
 const html=V.eo==='date'&&V.es==='all'&&up.length&&past.length
  ?[['Upcoming',up],['Past',past]].map(([t,a])=>`<section class="evg"><h3 class="evgh">${t} <span>${a.length}</span></h3><div class="evl">${a.map(evRow).join('')}</div></section>`).join('')
  :`<div class="evl">${items.map(evRow).join('')}</div>`;
 return{count,html}}
// redraw only the results, count and clear button (used while typing, so focus is never lost)
function evPaint(){
 const c=document.getElementById('evc'),r=document.getElementById('evres');if(!c||!r)return;
 const v=evView(),x=document.getElementById('evclr'),w=document.querySelector('.evq');
 c.textContent=v.count;r.innerHTML=v.html;if(x)x.hidden=!evActive();if(w)w.classList.toggle('has',!!V.q)}
// a dropdown: the visible text is a label, the real <select> sits invisibly on top, so phones open their native picker
function evSel(k,label,val,opts,on,cls){
 const cur=opts.find(o=>o[0]===val)||opts[0];
 return `<div class="evsel${on?' on':''}${cls?' '+cls:''}"><span class="evsk">${label}</span><span class="evsv">${esc(cur[2]||cur[1])}</span>${ei('down')}<select data-ef="${k}" aria-label="${label}">${opts.map(o=>`<option value="${esc(o[0])}"${o[0]===cur[0]?' selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`}
function list(){
 if(!S.events.length)return `<h2 class="evhd">Events</h2><div class="evempty">${ei('cal')}<h3>No events yet</h3><p>Create an event to take registrations, assign tasks and check people in.</p><button type="button" class="btn" data-go="new">New event</button></div>`;
 const v=evView(),tc={},st={up:0,past:0};
 S.events.forEach(e=>{tc[e.type]=(tc[e.type]||0)+1;st[dayGap(e)<0?'past':'up']++});
 const types=[...new Set([...Object.keys(TYPES),...Object.keys(tc)])].filter(t=>tc[t]||t===V.filter);
 const tOpts=[['All','All types ('+S.events.length+')','All'],...types.map(t=>[t,`${t} (${tc[t]||0})`,t])];
 const sOpts=[['all','All ('+S.events.length+')','All'],['up','Upcoming ('+st.up+')','Upcoming'],['past','Past ('+st.past+')','Past']];
 return `<h2 class="evhd">Events</h2>
 <div class="evbar" role="search">
  <div class="evq${V.q?' has':''}">${ei('search')}<input id="evq" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="Search by name, venue or type" aria-label="Search events" value="${esc(V.q)}"><button type="button" class="evx" data-clr="q" aria-label="Clear search">${ei('x')}</button></div>
  ${evSel('filter','Type',V.filter,tOpts,V.filter!=='All')}${evSel('es','Status',V.es,sOpts,V.es!=='all')}
 </div>
 <div class="evsum"><span><span id="evc" aria-live="polite">${v.count}</span><button type="button" class="evclr" id="evclr" data-clr="all"${evActive()?'':' hidden'}>Clear filters</button></span>${evSel('eo','Sort',V.eo,EV_SORT,false,'evs')}</div>
 <div id="evres">${v.html}</div>`;
}
function fieldInput(f){
 const n=`f_${f.id}`,r=f.req?'required':'';
 if(f.type==='checkbox')return `<label><input type="checkbox" name="${n}"> ${esc(f.label)}</label>`;
 if(f.type==='select')return `<label>${esc(f.label)}${f.req?' *':''}</label><select name="${n}" ${r}><option value="">Select</option>${f.opts.split(',').map(o=>`<option>${esc(o.trim())}</option>`).join('')}</select>`;
 return `<label>${esc(f.label)}${f.req?' *':''}</label><input name="${n}" ${r}>`;
}
function detail(){
 const e=ev(V.eid);if(!e)return list();
 return window.eventPage?eventPage(e):'<div class="empty">The event page did not load. Reload the app.</div>';
}
function form(){
 const x=V.draft;
 return `<h2 style="margin-bottom:12px">${x.id?'Edit event':'Create an event'}</h2>
 <form id="evf" class="card">
 <label>Event name *</label><input name="name" required value="${esc(x.name)}">
 <div class="two"><div><label>Type</label><select name="type">${Object.keys(TYPES).map(t=>`<option ${t===x.type?'selected':''}>${t}</option>`).join('')}</select></div>
 <div><label>Capacity</label><input name="cap" type="number" min="1" value="${x.cap}"></div>
 <div><label>Date</label><input name="date" type="date" required value="${x.date}"></div>
 <div><label>Time</label><input name="time" type="time" value="${x.time}"></div></div>
 <label>Venue or meeting link</label><input name="venue" value="${esc(x.venue)}">
 <label>Description</label><textarea name="desc" rows="3">${esc(x.desc)}</textarea>
 <h3 style="margin-top:20px">Registration form</h3>
 <div class="row" style="margin-bottom:8px"><button type="button" class="btn ghost sm" data-preset="1">Load form for this type</button></div>
 ${x.fields.map((f,i)=>`<div class="fld"><input data-fl="label" data-i="${i}" value="${esc(f.label)}" aria-label="Question">
 <select data-fl="type" data-i="${i}" aria-label="Answer type">${['text','select','checkbox'].map(t=>`<option value="${t}" ${f.type===t?'selected':''}>${{text:'Short text',select:'Dropdown',checkbox:'Tick box'}[t]}</option>`).join('')}</select>
 <label style="margin:0"><input type="checkbox" data-fl="req" data-i="${i}" ${f.req?'checked':''}> Required</label>
 <button type="button" class="btn ghost sm del" data-fx="${i}">Remove</button>
 ${f.type==='select'?`<input style="grid-column:1/-1" data-fl="opts" data-i="${i}" placeholder="Options, separated by commas" value="${esc(f.opts)}">`:''}</div>`).join('')}
 <button type="button" class="btn ghost sm" data-fadd="1">Add question</button>
 <div class="row" style="margin-top:20px"><button class="btn" type="submit">${x.id?'Save changes':'Publish event'}</button>${x.id?`<button type="button" class="btn ghost" data-open="${x.id}">Cancel</button>`:'<button type="button" class="btn ghost" data-go="events">Cancel</button>'}</div></form>`;
}
function syncDraft(){
 const f=document.getElementById('evf');if(!f)return;
 const fd=new FormData(f);['name','type','date','time','venue','desc'].forEach(k=>V.draft[k]=fd.get(k));V.draft.cap=+fd.get('cap')||1;
}
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;const D=t.dataset;
 if(D.go){if(D.go==='new')V.draft=newDraft();go(D.go)}
 else if(D.open){window.resetEv&&resetEv();V.dt='info';go('detail',D.open)}
 else if(D.clr){if(D.clr==='q'){V.q='';evPaint();const i=document.getElementById('evq');if(i){i.value='';i.focus()}}else{V.filter='All';V.es='all';V.q='';render()}}   // 3.13.0: clear search / clear filters
 else if(D.ci){const r=S.regs.find(r=>r.id===D.ci),E0=r&&ev(r.eid);if(!r||(E0&&window.can&&!can(E0,'regs')))return;
  if(r.in){r.in=false;delete r.inAt;delete r.inBy}else{r.in=true;r.inAt=Date.now();r.inBy=window.MYNAME||''}   // 3.5.0: who and when
  save();render();toast(r.in?'Checked in':'Check-in undone')}
 else if(D.rm){const E1=ev((S.regs.find(r=>r.id===D.rm)||{}).eid);if(E1&&window.can&&!can(E1,'event'))return;if(!confirm('Remove this registration?'))return;S.regs=S.regs.filter(r=>r.id!==D.rm);save();render();toast('Registration removed')}
 else if(D.del){const E0=ev(D.del),own=!E0||!E0.cloud||myRole(E0)==='owner';if(confirm(!own?'Leave this event?':E0&&E0.cloud?'Delete this event for everyone? Its chat, payment links, expenses, sponsors and online registrations are deleted with it.':'Delete this event and all its registrations?')){S.events=S.events.filter(x=>x.id!==D.del);S.regs=S.regs.filter(r=>r.eid!==D.del);save();go('events');toast('Event deleted')}}
 else if(D.edit){V.draft=JSON.parse(JSON.stringify(ev(D.edit)));go('new')}
 else if(D.preset){syncDraft();V.draft.fields=mk(V.draft.type);render()}
 else if(D.fadd){syncDraft();V.draft.fields.push({id:uid(),label:'New question',type:'text',req:false,opts:''});render()}
 else if(D.fx!==undefined){syncDraft();V.draft.fields.splice(+D.fx,1);render()}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.ef&&['filter','es','eo'].includes(t.dataset.ef)){const k=t.dataset.ef;V[k]=t.value;render();const n=document.querySelector(`[data-ef="${k}"]`);if(n)n.focus({preventScroll:true});return}   // 3.13.0: Events dropdowns; focus goes back to the same dropdown for keyboard users
 if(t.dataset.fl){const f=V.draft.fields[+t.dataset.i];const k=t.dataset.fl;f[k]=k==='req'?t.checked:t.value;if(k==='type'){syncDraft();render()}}
});
document.addEventListener('input',e=>{
 if(e.target.id==='evq'){V.q=e.target.value;evPaint()}
 else if(e.target.dataset.fl&&e.target.dataset.fl!=='req'&&e.target.tagName==='INPUT')V.draft.fields[+e.target.dataset.i][e.target.dataset.fl]=e.target.value;
});
document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target;
 if(f.id==='reg'){
  const ev1=ev(f.dataset.eid),fd=new FormData(f),data={};
  if(!ev1||(window.can&&!can(ev1,'addreg')))return;
  ev1.fields.forEach(q=>{data[q.id]=q.type==='checkbox'?(fd.get('f_'+q.id)?'Yes':'No'):fd.get('f_'+q.id)||''});
  const cid=window.cidOf?cidOf(ev1,data):'';
  if(regsOf(ev1.id).length>=ev1.cap)return toast('All '+ev1.cap+' seats are taken');
  if(cid&&regsOf(ev1.id).some(r=>window.regCid&&regCid(ev1,r)===cid))return toast('This College ID is already registered');   // 3.5.0: duplicate check
  const r1={id:rid(),eid:ev1.id,data,name:data[ev1.fields[0].id]||'Guest',in:false,at:Date.now(),src:'manual'};
  if(cid)r1.cid=cid;
  const pe=window.regPayFrom?regPayFrom(ev1,fd,r1):'';   // 3.6.0: cash or UPI, and who collects the cash
  if(pe)return toast(pe);
  S.regs.push(r1);
  save();render();toast('Registered')}
 else if(f.id==='evf'){
  syncDraft();const x=V.draft;
  if(x.id){S.events[S.events.findIndex(y=>y.id===x.id)]=x}else{x.id=uid();S.events.push(x)}
  save();const id=x.id;V.draft=null;window.resetEv&&resetEv();V.dt='info';go('detail',id);toast('Published')}
});
const cur=()=>ev(V.eid),sv=()=>{save();render()};
const qrSvg=s=>{try{const q=qrcode(0,'M');q.addData(s);q.make();return `<div class="qr">${q.createSvgTag(5,4)}</div>`}catch(x){return '<p class="meta">The QR library did not load. Share the UPI ID instead.</p>'}};
render();
</script>
