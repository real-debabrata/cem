<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10172B">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml" sizes="any">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="description" content="Register online and get your QR ticket for check-in.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Campus Events">
<meta property="og:title" content="Register for an event | Campus Events">
<meta property="og:description" content="Register online and get your QR ticket for check-in.">
<meta property="og:image" content="https://cem.deba.indevs.in/icons/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<link rel="stylesheet" href="splash.css">
<title>Register</title>
<style>
:root{box-sizing:border-box;--ink:#10172b;--mute:#5b6380;--line:#e1e4ef;--acc:#5948f5;--pg:#fff}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;min-height:100vh;font:15px/1.5 'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--pg);padding:max(16px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom));
background:radial-gradient(800px 500px at 0% 0%,rgba(89,72,245,.42),transparent 62%),#10172b}
main{max-width:440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;margin:6px 0 16px}
.card{background:#fff;color:var(--ink);border-radius:18px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.4);margin-bottom:14px}
h1{font-size:22px;margin:0 0 4px}.meta{color:var(--mute);font-size:13px;margin:0}
.step{display:flex;gap:10px;align-items:center;font-weight:700;margin:0 0 10px}.step i{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;font-style:normal;font-size:13px}
.qr{text-align:center;margin:12px 0}.qr svg{max-width:240px;width:100%;height:auto;border:1px solid var(--line);border-radius:12px;padding:6px;background:#fff}
.amt{font-size:30px;font-weight:800;text-align:center}
.det{background:#eef0f7;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}.det b{word-break:break-all}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
input,select{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;color:var(--ink);background:#fff}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 14px;cursor:pointer}
.go{width:100%;margin-top:16px;background:var(--acc);color:#fff}.go:disabled{opacity:.6}
.alt{background:#edeff8;color:var(--ink);padding:8px 12px;font-size:13px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.err{color:#c2331f;min-height:18px;font-size:13px;margin:8px 0 0}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:1px 10px;border-radius:20px;background:#edeff8;color:var(--ink)}.pill.warn{background:#fff1d6;color:#8a5200}.pill.ok{background:#ddf7f0;color:#087a62}
.chk{display:flex;gap:8px;align-items:center;font-weight:500}.chk input{width:auto}
.ok{text-align:center}.ok b{font-size:44px;display:block;color:#087a62}
.hid{display:none!important}
.bn{display:block;width:calc(100% + 44px);max-width:none;margin:-22px -22px 14px;border-radius:18px 18px 0 0;max-height:190px;object-fit:cover}
.pm{display:flex;gap:10px;margin:6px 0 4px}.pm label{flex:1;display:flex;gap:8px;align-items:center;justify-content:center;margin:0;padding:10px;border:1px solid var(--line);border-radius:10px;font-weight:700;cursor:pointer}
.pm input{width:auto}.pm label:has(input:checked){border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,#fff)}
.opts{display:grid;gap:6px;margin:8px 0 0}.opts label{display:flex;gap:8px;align-items:center;margin:0;font-weight:500}.opts input{width:auto}
</style><style>*{-webkit-tap-highlight-color:transparent}button,a.btn,summary,label{-webkit-user-select:none;user-select:none}input,textarea,select{-webkit-user-select:text;user-select:text}</style><link rel="stylesheet" href="auth.css">
</head><body>
<div id="splash" role="status" aria-label="Loading Campus Events"><div class="sp-logo"><i class="sp-ring"></i><div class="sp-mark"><svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="120" fill="#5948F5"/><path fill="#F6F7FB" transform="translate(136.4 105.2) scale(1.3)" d="M34 0 H160 A24 24 0 0 1 184 24 A24 24 0 0 1 160 48 H62 A14 14 0 0 0 48 62 V78 A14 14 0 0 0 62 92 H160 A24 24 0 0 1 184 116 A24 24 0 0 1 160 140 H62 A14 14 0 0 0 48 154 V170 A14 14 0 0 0 62 184 H160 A24 24 0 0 1 184 208 A24 24 0 0 1 160 232 H34 A34 34 0 0 1 0 198 V34 A34 34 0 0 1 34 0 Z"/></svg></div></div><div class="sp-name">Campus Events</div><div class="sp-sub">Getting your events ready</div><div class="sp-bar"><i></i></div></div>
<main>
<div class="brand"><svg width="30" height="30" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="120" fill="#5948F5"/><path fill="#F6F7FB" transform="translate(136.4 105.2) scale(1.3)" d="M34 0 H160 A24 24 0 0 1 184 24 A24 24 0 0 1 160 48 H62 A14 14 0 0 0 48 62 V78 A14 14 0 0 0 62 92 H160 A24 24 0 0 1 184 116 A24 24 0 0 1 160 140 H62 A14 14 0 0 0 48 154 V170 A14 14 0 0 0 62 184 H160 A24 24 0 0 1 184 208 A24 24 0 0 1 160 232 H34 A34 34 0 0 1 0 198 V34 A34 34 0 0 1 34 0 Z"/></svg>Campus Events</div>
<div id="root"><div class="card"><p class="meta">Loading registration page...</p></div></div>
</main>
<script>window.SPLASH_HOLD=1</script>
<script src="splash.js"></script>
<script src="firebase-config.js"></script>
<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-firestore-compat.js"></script>
<script src="qrcode.js"></script>
<script>
/* CEM 3.5.0: public self-registration page. Opened as register.html?e=EVENTCODE. No account needed.
   Reads regpages/{code} (public while the organizer keeps it open) and writes one application to regpages/{code}/subs/{EMAIL in lower case}.
   3.12.1: the email address is the only answer that is always required, and it is the document id, so each email address can apply once per event
   (firestore.rules enforce it). College ID, phone and every other answer come from the event's own questions and their Required tick. */
const $=id=>document.getElementById(id),root=$('root');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const qs=new URLSearchParams(location.search),C=window.FB_CONFIG||{};
const slug=(qs.get('r')||'').trim().toLowerCase();let code=(qs.get('e')||'').trim().toUpperCase();
const norm=s=>String(s==null?'':s).toUpperCase().replace(/[^A-Z0-9]/g,'');
const fail=(t,m)=>{root.innerHTML='<div class="card"><h1>'+esc(t)+'</h1><p class="meta">'+esc(m)+'</p></div>';window.splashDone&&splashDone()};
const loadPage=()=>firebase.firestore().collection('regpages').doc(code).get().then(d=>d.exists?show(d.data()):fail('Registration unavailable','This registration page does not exist or has been removed.'))
  .catch(x=>fail('Registration closed',x&&x.code==='permission-denied'?'Registration for this event is closed. Ask the organizers if you think this is a mistake.':'Could not load this page. Check your connection and try again.'));
if(!window.firebase||!C.apiKey||/YOUR_/.test(C.apiKey)||(!slug&&!/^[A-Z]{6}$/.test(code)))fail('Registration unavailable','This registration link is incomplete or not set up.');
else{
 firebase.initializeApp(C);
 if(slug){   // a custom link name such as /r/techfest-2026 points to the event code through regslugs/{name}
  if(!/^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$/.test(slug))fail('Registration unavailable','This registration link is not valid.');
  else firebase.firestore().collection('regslugs').doc(slug).get().then(d=>{
   const c=d.exists?String((d.data()||{}).eid||'').toUpperCase():'';
   if(!/^[A-Z]{6}$/.test(c))return fail('Registration unavailable','This registration link does not exist or has been removed.');
   code=c;return loadPage();
  }).catch(()=>fail('Registration unavailable','Could not load this page. Check your connection and try again.'));
 }else loadPage();
}
const CID_RE=/college\s*id|student\s*id|roll\s*(no|number)|enrol|registration\s*(no|number|id)|reg\.?\s*(no|number)/i,
 EM_RE=/e-?mail/i,PH_RE=/phone|mobile|whatsapp/i,EMAIL_OK=/^[^@\s\/]+@[^@\s\/]+\.[^@\s\/]+$/;
const BG={indigo:'radial-gradient(800px 500px at 0% 0%,rgba(89,72,245,.42),transparent 62%),#10172b',
 sunset:'linear-gradient(135deg,#2b0f3a,#7a1f5c 55%,#d9482b)',ocean:'linear-gradient(135deg,#031d3a,#0b4f8a 60%,#0e8a8a)',forest:'linear-gradient(135deg,#06210f,#145a32 60%,#2e8b3d)',
 graphite:'linear-gradient(135deg,#111418,#232a33 60%,#3a4350)',light:'#f6f7fb'};
function applyTheme(t){   // t comes from the organizer's page document; every value is checked again here
 t=t||{};const ac=/^#[0-9a-f]{6}$/i.test(t.ac||'')?t.ac:'#5948f5',bg=BG[t.bg]?t.bg:'indigo';
 document.documentElement.style.setProperty('--acc',ac);
 document.body.style.background=BG[bg];document.body.style.setProperty('--pg',bg==='light'?'#10172b':'#fff');
}
function show(r){
 if(!r.open||(r.until&&Date.now()>r.until))return fail('Registration closed','Registration for this event is closed.');
 const th=r.th||{};applyTheme(th);
 document.title='Register: '+r.name;setTimeout(()=>window.splashDone&&splashDone(),0);
 const fields=r.fields||[],pick=(re,not)=>fields.find(f=>f!==not&&f.type!=='checkbox'&&re.test(f.label||'')),
  cidF=pick(CID_RE),emF=pick(EM_RE),phF=pick(PH_RE,emF),full=(+r.taken||0)>=(+r.cap||0),left=Math.max(0,(+r.cap||0)-(+r.taken||0));
 if(full&&!r.wl)return fail('This event is full','All '+r.cap+' seats are taken and there is no waitlist. Ask the organizers if more seats open up.');
 const when=new Date(r.date+'T'+(r.time||'00:00')),okd=!isNaN(when);
 const dt=okd?when.toLocaleDateString([],{weekday:'long',day:'numeric',month:'long',year:'numeric'})+(r.time?', '+when.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):''):esc(r.date||'');
 const fee=+r.fee||0,upi=r.upi||'',cashL=(fee>0&&!full&&Array.isArray(r.cash))?r.cash.filter(c=>c&&c.id&&c.n):[],cashOn=cashL.length>0;
 const inp=f=>{const n='f_'+esc(f.id),req=(f.req||f===emF)?' *':'';
  if(f.type==='checkbox')return `<label class="chk"><input type="checkbox" name="${n}"> ${esc(f.label)}</label>`;
  if(f.type==='select')return `<label for="${n}">${esc(f.label)}${req}</label><select id="${n}" name="${n}"><option value="">Select</option>${String(f.opts||'').split(',').map(o=>`<option>${esc(o.trim())}</option>`).join('')}</select>`;
  const at=f===emF?' maxlength="100" type="email" inputmode="email" autocomplete="email"':f===phF?' maxlength="20" type="tel" inputmode="tel" autocomplete="tel"':' maxlength="200" autocomplete="off"';
  return `<label for="${n}">${esc(f.label)}${req}</label><input id="${n}" name="${n}"${at}>`};
 const link='upi://pay?pa='+encodeURIComponent(upi)+'&pn='+encodeURIComponent(r.payee||'')+'&am='+fee+'&cu=INR&tn='+encodeURIComponent('Registration: '+r.name);
 let svg='';if(fee>0&&upi&&!full){try{const q=qrcode(0,'M');q.addData(link);q.make();svg=q.createSvgTag(8,4)}catch(e){}}
 const upiOn=!!svg,both=upiOn&&cashOn,how=both?'UPI or cash':upiOn?'UPI':cashOn?'cash':'';
 const banner=/^https:\/\/[^\s"'<>]{4,290}$/i.test(th.bn||'')?`<img class="bn" src="${esc(th.bn)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:'';
 const head=th.hd||r.name,showSeats=th.ss!==0,btn=th.bt||'Send registration';
 const payHtml=fee>0&&!full?`<p class="step" style="margin-top:18px"><i>2</i> Ticket fee${how?': pay by '+how:''} (you can also pay later)</p>
   ${both?`<div class="pm" role="radiogroup" aria-label="How will you pay?"><label><input type="radio" name="pm" value="upi" checked> UPI</label><label><input type="radio" name="pm" value="cash"> Cash</label></div>`:''}
   ${upiOn?`<div id="pu"><div class="amt">₹${fee}</div><div class="qr">${svg}</div><div class="row"><button class="alt" id="cp" type="button">Copy UPI ID</button></div><div class="det">Pay to: <b>${esc(r.payee||'')}</b><br>UPI ID: <b>${esc(upi)}</b></div>
    <label for="utr">UTR / reference number (if you already paid)</label><input id="utr" maxlength="40" autocapitalize="characters" autocomplete="off"><p class="meta" style="margin:4px 0 0">You can leave this empty and pay later; the organizers will tell you how.</p></div>`:''}
   ${cashOn?`<div id="pc" class="${upiOn?'hid':''}"><div class="amt">₹${fee}</div><label for="cc">Who will you pay the cash to? *</label><select id="cc"><option value="">Choose a person</option>${cashL.map(c=>`<option value="${esc(c.id)}">${esc(c.n)}</option>`).join('')}</select>
    <div class="opts"><label><input type="radio" name="cp" value="0" checked> I will pay later</label><label><input type="radio" name="cp" value="1"> I have already paid this person</label></div>
    <p class="meta" style="margin:6px 0 0">Your registration is confirmed once the organizers have checked the payment with the person you chose.</p></div>`:''}
   ${!upiOn&&!cashOn?`<p class="meta">The ticket fee is ₹${fee}. The organizers will tell you how to pay after they approve your registration.</p>`:''}`:'';
 root.innerHTML=`<div class="card">${banner}<p class="meta">${esc(r.type||'')}</p><h1>${esc(head)}</h1>
  <p class="meta">${dt}${r.venue&&!/^https?:/i.test(r.venue)?'<br>'+esc(r.venue):''}</p>
  ${th.in?`<p style="margin:10px 0 0;white-space:pre-wrap">${esc(th.in)}</p>`:''}
  ${r.desc?`<p style="margin:10px 0 0;white-space:pre-wrap">${esc(r.desc)}</p>`:''}
  <p style="margin:12px 0 0">${full?'<span class="pill warn">Event is full: you can join the waitlist</span>':showSeats?`<span class="pill ok">${left} seat${left===1?'':'s'} left</span>`:''} ${fee>0?`<span class="pill">Ticket ₹${fee}</span>`:'<span class="pill">Free</span>'}</p>
  ${r.msg?`<p class="meta" style="margin:10px 0 0">${esc(r.msg)}</p>`:''}</div>
 <div class="card" id="fc"><p class="step"><i>1</i> ${full?'Join the waitlist':'Your details'}</p>
  ${fields.map(inp).join('')}
  ${emF?'':'<label for="em">Email *</label><input id="em" type="email" maxlength="100" inputmode="email" autocomplete="email">'}
  ${phF?'':'<label for="ph">Phone / WhatsApp</label><input id="ph" type="tel" maxlength="20" inputmode="tel" autocomplete="tel">'}
  <p class="meta" style="margin:4px 0 0">The organizers send your ticket to your email address.</p>
  ${payHtml}
  ${full?'<p class="meta" style="margin-top:12px">All seats are taken. If a seat frees up the organizers will promote you from the waitlist and contact you.</p>':''}
  <div class="hp" aria-hidden="true"><label>Leave empty<input id="hp" tabindex="-1" autocomplete="off"></label></div>
  <p class="err" id="er" role="alert"></p><button class="go" id="go">${full?'Join waitlist':esc(btn)}</button></div>`;
 const cp=$('cp');if(cp)cp.onclick=()=>{try{navigator.clipboard.writeText(upi);cp.textContent='Copied'}catch(e){}};
 const mode=()=>{const m=document.querySelector('input[name="pm"]:checked');return m?m.value:(upiOn?'upi':cashOn?'cash':'')};
 document.querySelectorAll('input[name="pm"]').forEach(x=>x.onchange=()=>{const c=mode()==='cash';$('pu')&&$('pu').classList.toggle('hid',c);$('pc')&&$('pc').classList.toggle('hid',!c)});
 $('go').onclick=()=>{
  const er=$('er'),vals={};let missing='';
  if($('hp').value)return;
  fields.forEach(f=>{const el=document.querySelector('[name="f_'+f.id+'"]');if(!el)return;
   const v=f.type==='checkbox'?(el.checked?'Yes':'No'):el.value.trim().slice(0,200);vals[f.id]=v;
   if(f.req&&f.type!=='checkbox'&&!v&&!missing)missing=f.label});
  if(missing)return er.textContent='Please fill in: '+missing+'.';
  // 3.12.1: only the email address is always required. Everything else is whatever the organizer asked for (their questions and Required ticks).
  const em=String(emF?vals[emF.id]:$('em').value).trim();
  if(!em)return er.textContent='Enter your email address.';
  if(em.length>100||!EMAIL_OK.test(em))return er.textContent='That email address does not look right.';
  const ph=String(phF?vals[phF.id]:$('ph').value).trim().slice(0,20);
  const first=fields[0],n=(String((first&&vals[first.id])||'').trim()||em.split('@')[0]).slice(0,80);   // no name question, or left empty by the organizer's choice: use the part of the email before the @
  const cid=cidF?norm(vals[cidF.id]):'';   // only when the event has a College ID question and the person filled it in
  const pmv=fee>0&&!full?mode():'';
  const ut=pmv==='upi'&&$('utr')?norm($('utr').value):'';
  if(ut&&ut.length<6)return er.textContent='The UTR must be at least 6 characters, or leave it empty.';
  let cc='',cpd=false;
  if(pmv==='cash'){cc=$('cc').value;if(!cc)return er.textContent='Choose who you will pay the cash to.';cpd=(document.querySelector('input[name="cp"]:checked')||{}).value==='1'}
  const x=JSON.stringify(vals);if(x.length>3000)return er.textContent='Some answers are too long.';
  const doc={n,em,x,s:full?'waitlist':'pending',at:Date.now()};
  if(cid.length>=3&&cid.length<=24)doc.cid=cid;if(ph)doc.ph=ph;if(ut)doc.utr=ut;
  if(pmv){doc.pm=pmv;if(pmv==='cash'){doc.cc=cc;doc.cp=cpd}}
  er.textContent='';$('go').disabled=true;
  Promise.resolve().then(()=>firebase.firestore().collection('regpages').doc(code).collection('subs').doc(em.toLowerCase()).set(doc))
   .then(()=>{const ty=th.ty?`<p style="margin:10px 0 0;white-space:pre-wrap">${esc(th.ty)}</p>`:'';
    const pay=pmv==='cash'?`<p class="meta">Cash: ${cpd?'you said you paid':'please pay'} <b>${esc((cashL.find(c=>c.id===cc)||{}).n||'')}</b>${cpd?'':' before the event'}.</p>`:'';
    $('fc').innerHTML=`<div class="ok"><b>&#10003;</b><h1>${full?'You are on the waitlist':'Thank you, '+esc(n)}</h1><p class="meta">${full?'We will contact you if a seat opens up.':'The organizers will check your registration and send your ticket to your email address.'}</p>${pay}${ty}<p class="meta">Registered with: <b>${esc(em)}</b></p></div>`})
   .catch(x=>{$('go').disabled=false;er.textContent=x.code==='permission-denied'?'This email address has already registered for this event, or registration has just closed. If it is a mistake, ask the organizers.':'Could not send. Please try again.'});
 };
}
</script></body></html>
